[package]
name = "disk-insight"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "disk-insight"
path = "src/main.rs"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
] }
anyhow     = "1"    # エラー処理
byteorder  = "1"    # バッファのバイト列読み取り
rayon      = "1"    # 並列パース
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true